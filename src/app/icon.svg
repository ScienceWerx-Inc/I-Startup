<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep navy readout background -->
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#16293f" />
      <stop offset="100%" stop-color="#0b1b2b" />
    </radialGradient>

    <!-- Score arc: brand blue rising to bright -->
    <linearGradient id="scoreGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0063c7" />
      <stop offset="55%" stop-color="#0090ff" />
      <stop offset="100%" stop-color="#70c1ff" />
    </linearGradient>

    <!-- Inner glass highlight -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Container squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" />
  <rect x="32" y="32" width="448" height="380" rx="104" fill="url(#glassGrad)" />

  <!-- Gauge track: the full 0–500 scale -->
  <path d="M 121 312 A 135 135 0 0 1 391 312"
        fill="none" stroke="#22364b" stroke-width="38" stroke-linecap="round" />

  <!-- Score arc: from 0 up into the top band (investment-ready zone) -->
  <path d="M 121 312 A 135 135 0 0 1 378.4 254.9"
        fill="none" stroke="url(#scoreGrad)" stroke-width="38" stroke-linecap="round" />

  <!-- Band boundary ticks: Early stage / Emerging / Strong foundation / Investment ready -->
  <g stroke="#0b1b2b" stroke-width="7" stroke-linecap="round">
    <line x1="121" y1="312" x2="143" y2="312" />
    <line x1="160.5" y1="216.5" x2="176" y2="230.4" />
    <line x1="256" y1="177" x2="256" y2="199" />
    <line x1="351.5" y1="216.5" x2="336" y2="230.4" />
    <line x1="391" y1="312" x2="369" y2="312" />
  </g>

  <!-- Needle pointing into the top band -->
  <line x1="256" y1="312" x2="311" y2="216.7"
        stroke="#eef3f8" stroke-width="15" stroke-linecap="round" />
  <circle cx="311" cy="216.7" r="11" fill="#0090ff" />

  <!-- Hub -->
  <circle cx="256" cy="312" r="24" fill="#eef3f8" />
  <circle cx="256" cy="312" r="10" fill="#0b1b2b" />
</svg>
