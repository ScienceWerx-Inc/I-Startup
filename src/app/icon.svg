<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1d33" />
      <stop offset="100%" stop-color="#000c18" />
    </radialGradient>

    <!-- Main Cyan Blue Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066ff" />
      <stop offset="50%" stop-color="#0090FF" />
      <stop offset="100%" stop-color="#70C1FF" />
    </linearGradient>

    <!-- Bright Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#70C1FF" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box / Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" />

  <!-- Inner Glass Highlight -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.3" />

  <g filter="url(#glow)">
    <!-- Dot of the 'i' -->
    <circle cx="210" cy="155" r="32" fill="url(#sparkGrad)" />

    <!-- Stem of the 'i' -->
    <path d="M 182 230 C 182 215, 238 215, 238 230 L 238 350 C 238 365, 182 365, 182 350 Z" fill="url(#primaryGrad)" />

    <!-- Rocket / Upward Surge Arc -->
    <path d="M 120 380 C 180 370, 270 330, 360 170 C 340 210, 310 240, 270 260 C 220 285, 160 300, 120 380 Z" fill="url(#primaryGrad)" opacity="0.9" />

    <!-- Ascending Arrow Head -->
    <path d="M 360 170 L 375 225 L 340 210 Z" fill="url(#sparkGrad)" />

    <!-- Rocket Thruster / Spark Lines -->
    <path d="M 370 150 L 390 130 M 370 130 L 370 110 M 390 150 L 410 150 M 385 165 L 405 175" stroke="url(#sparkGrad)" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
